<!doctype html>
<html lang="pt-br"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Libby</title>

<script>
  try{
    if(localStorage.getItem('libby-tema')==='dark')
      document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
</script>




<link rel="stylesheet" href="style.css">
<style>
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-box{width:100%;max-width:390px}
  .login-logo{text-align:center;margin-bottom:22px}
  .login-logo img{width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 10px}
  .login-logo b{font-size:26px;color:var(--navy);letter-spacing:.5px}
  .login-logo div{font-size:12.5px;color:var(--muted);margin-top:2px}
  .login-erro{background:var(--red-soft);border:1px solid var(--erro-line);color:var(--red-ink);
              padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .login-aviso{background:var(--amber-soft);border:1px solid var(--aviso-line);color:var(--amber-ink);
               padding:10px 13px;border-radius:8px;font-size:12.5px;margin-bottom:14px}
</style></head>
<body><div class="login-wrap"><div class="login-box">
  <div class="login-logo">
    <img src="logo-libby.png" alt="" width="72" height="72">
    <b>Libby</b><div>Central de Automações</div></div>

  
  

  <div class="panel"><div class="bd" style="padding:20px">
    <form method="post" action="#" data-demo-acao="/login">
      <input type="hidden" name="next" value="/">
      <div class="fld"><label>Setor</label>
        <select name="setor" id="lg-setor" onchange="lgSetor()">
          
            <option value="admin" >
              Administração
            </option>
          
            <option value="dp" >
              Departamento Pessoal
            </option>
          
            <option value="fiscal" >
              Fiscal
            </option>
          
            <option value="marketing" >
              Marketing
            </option>
          
        </select>
      </div>
      
      <div class="fld" id="lg-lista"><label>Seu nome</label>
        <select name="usuario_id" id="lg-usuario" required></select>
      </div>
      <div class="fld" id="lg-livre"><label>Seu nome</label>
        <input name="usuario" id="lg-nome" autocomplete="name" placeholder="ex.: Mariana" required>
        <div class="muted" style="font-size:11.5px;margin-top:4px">
          Fica registrado em quem executou cada automação.
        </div>
      </div>
      <div class="fld"><label>Senha do setor</label>
        <input type="password" name="senha" autocomplete="current-password" required>
      </div>
      <button class="btn pri" type="submit" style="width:100%">Entrar</button>
    </form>
<script>
  var LG_EQUIPE = {};
  LG_EQUIPE["admin"] = [{"id": 1, "nome": "Visitante"}];
  LG_EQUIPE["dp"] = [{"id": 2, "nome": "Ana Ribeiro"}, {"id": 3, "nome": "Bruno Tavares"}, {"id": 4, "nome": "Camila Freitas"}];
  LG_EQUIPE["fiscal"] = [{"id": 5, "nome": "Diego Moura"}, {"id": 6, "nome": "Elisa Prado"}];
  LG_EQUIPE["marketing"] = [{"id": 7, "nome": "F\u00e1bio Nunes"}];
  
  // Lembra setor e pessoa do último login neste navegador (só conveniência).
  var LG_KEY = 'libby-login', lgUltimo = {};
  try { lgUltimo = JSON.parse(localStorage.getItem(LG_KEY) || '{}') || {}; } catch(e) {}

  function lgSetor(){
    var setor = document.getElementById('lg-setor').value;
    var equipe = LG_EQUIPE[setor] || [];
    var sel = document.getElementById('lg-usuario'), nome = document.getElementById('lg-nome');
    var comLista = equipe.length > 0;
    document.getElementById('lg-lista').style.display = comLista ? '' : 'none';
    document.getElementById('lg-livre').style.display = comLista ? 'none' : '';
    sel.disabled = !comLista; nome.disabled = comLista;
    sel.innerHTML = '<option value="">— escolha —</option>';
    equipe.forEach(function(u){
      var o = document.createElement('option');
      o.value = u.id; o.textContent = u.nome;
      if (String(u.id) === String(lgUltimo.usuario_id)) o.selected = true;
      sel.appendChild(o);
    });
  }
  (function(){
    var s = document.getElementById('lg-setor');
    var alvo = lgUltimo.setor && s.querySelector('option[value="' + lgUltimo.setor + '"]:not([disabled])');
    if (alvo) s.value = lgUltimo.setor;
    else if (s.selectedOptions[0] && s.selectedOptions[0].disabled) {
      var livre = s.querySelector('option:not([disabled])'); if (livre) s.value = livre.value;
    }
    lgSetor();
    s.form.addEventListener('submit', function(){
      try {
        localStorage.setItem(LG_KEY, JSON.stringify({
          setor: s.value, usuario_id: document.getElementById('lg-usuario').value }));
      } catch(e) {}
    });
  })();
</script>
